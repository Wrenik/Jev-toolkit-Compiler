name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The dependency repository is checked out next to this one and installed editable, so CI works
      # from the first push (before any package is published).
      - uses: actions/checkout@v4
        with:
          repository: Wrenik/Jev-toolkit-usage
          path: Jev-toolkit-usage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./Jev-toolkit-usage
      # --no-deps: the dependency is installed above; its git URL in pyproject.toml only works once public.
      - run: python -m pip install --no-deps -e . pytest ruff mypy
      - run: python -m ruff check src tests tools
      - run: python -m mypy
      # Offline tests only: no API key is configured in CI and none is needed.
      - run: python -m pytest
        env:
          JEV_JUDGE: fake

[project]
name = "jev-toolkit-compiler"
version = "0.1.0"
description = "Context log, search and a compact/clear advisor for Claude Code, built on a judgement model (TypeSafe Jev)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Ährlund" }]
requires-python = ">=3.11"
dependencies = [
    # Direct reference: works once Jev-toolkit-usage is public. Before that, install it editable from a local
    # clone first (pip install -e ../Jev-toolkit-usage); pip then sees the requirement as already satisfied.
    "jev-toolkit-usage @ git+https://github.com/Wrenik/Jev-toolkit-usage.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Jev API (costs a fraction of a cent; needs TYPESAFE_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B023", "UP007", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
